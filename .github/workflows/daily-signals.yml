name: Daily PSX signal update
on:
  schedule:
    - cron: "45 10 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: daily-psx-signals
  cancel-in-progress: false
jobs:
  update-signals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate end-of-day signals
        run: python scripts/generate_signals.py
      - name: Commit daily signal board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          if git diff --cached --quiet; then
            echo "No signal file changes."
          else
            git commit -m "Update daily PSX signals"
            git push
          fi
